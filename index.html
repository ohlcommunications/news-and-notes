<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHL News &amp; Notes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0085CA;--dark:#003B6F;--side:#f4f6f9}
body{font-family:system-ui,-apple-system,sans-serif;background:#bbb}
.app{display:grid;grid-template-columns:390px 1fr;height:100vh;overflow:hidden}
.form-panel{background:var(--side);display:flex;flex-direction:column;overflow:hidden}
.panel-hd{background:var(--blue);padding:14px 18px;flex-shrink:0}
.panel-hd h1{font-size:13px;font-weight:700;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.panel-hd p{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px}
.tabs{display:flex;background:#e4eaf2;flex-shrink:0}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:rgba(0,59,111,.45);font:600 10.5px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;padding:11px 0;cursor:pointer;transition:all .15s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.pane{display:none;overflow-y:auto;flex:1}
.pane.active{display:block}
.sec-lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);padding:14px 18px 8px;border-bottom:1px solid rgba(0,59,111,.1)}
.field{padding:10px 18px;border-bottom:1px solid rgba(0,59,111,.07)}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(0,59,111,.55);margin-bottom:5px}
.field input,.field textarea{width:100%;background:#fff;border:1px solid rgba(0,59,111,.2);border-radius:4px;color:#111;font:13px system-ui;padding:7px 9px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{resize:vertical;line-height:1.5}
.dyn-row{position:relative}
.rm-btn{width:18px;height:18px;background:rgba(180,0,0,.12);border:none;border-radius:3px;color:#b00;font:700 14px/18px system-ui;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rm-btn:hover{background:rgba(180,0,0,.28)}
.add-btn{display:block;width:100%;margin-top:6px;background:none;border:1px dashed rgba(0,85,202,.28);border-radius:4px;color:rgba(0,59,111,.5);font:600 10px system-ui;letter-spacing:.04em;padding:6px;cursor:pointer;text-transform:uppercase;transition:all .15s}
.add-btn:hover{background:rgba(0,59,111,.05);border-color:rgba(0,59,111,.4);color:rgba(0,59,111,.7)}
.ldrs-hd{display:grid;grid-template-columns:2fr 46px 22px 22px 22px 30px 20px;gap:3px;padding:0 0 4px}
.ldrs-hd span{font:600 9px system-ui;letter-spacing:.06em;text-transform:uppercase;color:rgba(0,59,111,.5)}
.ldrs-row{display:grid;grid-template-columns:2fr 46px 22px 22px 22px 30px 20px;gap:3px;margin-bottom:3px;align-items:center}
.ldrs-row input{font-size:11px!important;padding:4px 4px!important;text-align:center;background:#fff;border:1px solid rgba(0,59,111,.2);border-radius:3px;color:#111;outline:none;width:100%}
.ldrs-row input:first-child,.ldrs-row input:nth-child(2){text-align:left}
.bday-row{display:grid;gap:3px;margin-bottom:3px;align-items:center}
.bday-row input{width:100%;background:#fff;border:1px solid rgba(0,59,111,.2);border-radius:3px;color:#111;font:12px system-ui;padding:5px 5px;outline:none}
.grid-hd{display:grid;gap:3px;padding:0 0 4px}
.grid-hd span{font:600 9px system-ui;letter-spacing:.06em;text-transform:uppercase;color:rgba(0,59,111,.5)}
.news-entry{background:rgba(0,59,111,.03);border:1px solid rgba(0,59,111,.1);border-radius:4px;padding:7px 8px 7px 8px;margin-bottom:5px;display:flex;flex-direction:column;gap:4px;position:relative}
.news-entry-hd{display:flex;gap:4px;align-items:center}
.news-entry-hd input{flex:1;background:#fff;border:1px solid rgba(0,59,111,.15);border-radius:3px;color:#111;font:12px system-ui;padding:5px 7px;outline:none}
.news-entry textarea{width:100%;background:#fff;border:1px solid rgba(0,59,111,.15);border-radius:3px;color:#111;font:11px system-ui;padding:5px 7px;outline:none;resize:vertical;line-height:1.5}
.officials-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.officials-grid input{width:100%;background:#fff;border:1px solid rgba(0,59,111,.2);border-radius:4px;color:#111;font:12px system-ui;padding:6px 8px;outline:none}
.officials-lbl{font:600 9px system-ui;letter-spacing:.06em;text-transform:uppercase;color:rgba(0,59,111,.5);margin-bottom:4px;display:block}
.actions{padding:14px 18px;display:flex;gap:8px}
.btn{flex:1;padding:9px;border:none;border-radius:5px;font:700 11px system-ui;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--blue);color:#fff}
.btn-dark{background:var(--dark);color:#fff}
.btn-ghost{background:rgba(0,59,111,.12);color:#003B6F}
.locked-notice{display:none;padding:9px 18px;background:rgba(0,133,202,.1);font:600 10.5px system-ui;color:var(--blue);letter-spacing:.04em}
.preview-panel{display:flex;flex-direction:column;overflow:hidden;background:#999}
.preview-bar{background:var(--dark);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.preview-bar span{font:600 10.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.preview-bar button{background:var(--blue);color:#fff;border:none;border-radius:5px;padding:7px 14px;font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.preview-wrap{flex:1;overflow-y:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}
.doc{width:700px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.28);font-family:system-ui,-apple-system,sans-serif}
.doc-hd{background:#fff;border-bottom:3px solid var(--blue);padding:13px 24px;display:flex;align-items:center}
.doc-logo-area{min-width:80px}
.doc-logo-img{height:34px;width:auto;display:block}
.doc-logo-text{font:900 22px/1 system-ui;color:var(--blue)}
.doc-title{flex:1;text-align:center;padding:0 12px}
.doc-title-main{font:700 14px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--dark)}
.doc-title-sub{font:400 10px/1 system-ui;color:rgba(0,59,111,.5);margin-top:3px;letter-spacing:.03em}
.doc-hd-right{text-align:right;min-width:120px}
.doc-date{font:400 10.5px/1.4 system-ui;color:rgba(0,59,111,.7)}
.doc-season{font:700 9px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-top:4px}
.doc-matchup{background:var(--blue);padding:11px 24px;display:flex;align-items:center;justify-content:center;gap:14px}
.doc-team{flex:1;text-align:center}
.doc-team-lbl{font:700 8px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:4px}
.doc-team-name{font:700 15px/1 system-ui;color:#fff}
.doc-team-rec{font:400 10px/1 system-ui;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.02em}
.doc-vs{font:700 10px/1 system-ui;color:rgba(255,255,255,.5);letter-spacing:.08em}
.doc-info{background:#f4f4f4;border-bottom:2px solid var(--blue);padding:6px 24px;display:flex;gap:22px;flex-wrap:wrap}
.doc-info-item{font:400 11px/1 system-ui;color:#555}
.doc-info-item strong{font-weight:700;color:#111}
.doc-body{display:grid;grid-template-columns:1fr 1fr}
.doc-col{padding:14px 18px;border-right:1px solid #eee}
.doc-col:last-child{border-right:none}
.doc-sec-hd{font:700 8.5px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid #eee;padding-bottom:5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.badge{font:700 7.5px/1 system-ui;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:3px;background:var(--blue);color:#fff}
.badge.dark{background:var(--dark)}
.ldr-tbl{width:100%;border-collapse:collapse;font-size:11px}
.ldr-tbl th{font:700 8px/1 system-ui;letter-spacing:.07em;text-transform:uppercase;color:#bbb;text-align:right;padding:0 3px 4px;border-bottom:1px solid #eee}
.ldr-tbl th:first-child,.ldr-tbl th:nth-child(2){text-align:left}
.ldr-tbl td{padding:4px 3px;border-bottom:1px solid #f4f4f4;text-align:right;color:#222}
.ldr-tbl td:first-child{font-weight:700;text-align:left}
.ldr-tbl td:nth-child(2){color:#999;font-size:10px;text-align:left}
.rank-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.rank-tbl tr{border-bottom:1px solid #f4f4f4}
.rank-tbl tr:last-child{border-bottom:none}
.rank-num{width:18px;font:700 9px/1 system-ui;color:var(--blue);padding:3px 3px;vertical-align:middle}
.rank-team{font:500 10.5px/1.3 system-ui;color:#222;padding:3px 4px;vertical-align:middle}
.rank-div{width:10px}
.rank-up{font:700 8px/1 system-ui;color:#1a8a1a;margin-left:4px;white-space:nowrap}
.rank-dn{font:700 8px/1 system-ui;color:#cc2222;margin-left:4px;white-space:nowrap}
.sched-item{font:400 10.5px/1.6 system-ui;color:#333;padding:2px 0;border-bottom:1px solid #f5f5f5}
.sched-item:last-child{border-bottom:none}
.result-entry{padding:3px 0;border-bottom:1px solid #f0f0f0}
.result-entry:last-child{border-bottom:none}
.result-score{font:600 10.5px/1.4 system-ui;color:#222}
.result-note{font:400 9.5px/1.5 system-ui;color:#777;margin-top:1px}
.news-item{padding:5px 0;border-bottom:1px solid #f0f0f0}
.news-item:last-child{border-bottom:none}
.news-headline{font:700 10.5px/1.3 system-ui;color:#111;margin-bottom:2px}
.news-body{font:400 10px/1.5 system-ui;color:#555}
.bday-cat{font:700 8px/1 system-ui;letter-spacing:.07em;text-transform:uppercase;color:#aaa;margin:6px 0 3px}
.bday-item{font:400 10px/1.5 system-ui;color:#333;padding:2px 0 2px 16px;position:relative;border-bottom:1px solid #f5f5f5}
.bday-item::before{content:'🎂';position:absolute;left:0;font-size:9px;top:3px}
.bullet-list{list-style:none}
.bullet-list li{font-size:10px;color:#333;line-height:1.5;padding:2px 0 2px 12px;position:relative;border-bottom:1px solid #f5f5f5}
.bullet-list li::before{content:'•';position:absolute;left:2px;color:var(--blue);font-weight:700}
.note-text{font-size:10px;color:#333;line-height:1.6;white-space:pre-wrap}
.officials-doc{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.official-item{padding:4px 6px;background:#f8f8f8;border:1px solid #eee;border-radius:3px}
.official-role{font:700 7.5px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:#aaa;margin-bottom:3px}
.official-name{font:400 10px/1 system-ui;color:#222}
.club-note{margin-top:8px;background:#f5f5f5;border-left:3px solid var(--dark);padding:5px 9px;font:italic 10px/1.5 system-ui;color:#444}
.empty-state{font:italic 10px/1 system-ui;color:#ccc}
.sec-gap{margin-top:10px}
.doc-ft{background:#f0f0f0;border-top:2px solid var(--dark);padding:6px 24px;display:flex;justify-content:space-between;font:400 9px/1 system-ui;color:#999}
.view-toggle{display:flex;gap:6px}
.view-btn{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border:none;border-radius:4px;padding:6px 12px;font:600 10px system-ui;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.view-btn.active{background:#fff;color:var(--dark)}
.social-wrap{display:none;flex:1;overflow-y:auto;padding:24px;justify-content:center;align-items:flex-start;background:#999}
.social-wrap.active{display:flex}
.preview-wrap.hidden{display:none}
.social-card{width:480px;min-height:600px;background:var(--dark);border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.sc-header{background:var(--blue);padding:20px 24px;display:flex;align-items:center;gap:14px}
.sc-logo{height:28px;width:auto}
.sc-title-block{flex:1}
.sc-title{font:800 16px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.sc-date{font:400 11px/1 system-ui;color:rgba(255,255,255,.75);margin-top:4px;letter-spacing:.03em}
.sc-handle{font:700 11px/1 system-ui;color:rgba(255,255,255,.5);letter-spacing:.04em}
.sc-body{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.sc-section{}
.sc-sec-lbl{font:700 8.5px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(0,133,202,.3)}
.sc-headline{font:600 12px/1.45 system-ui;color:#fff;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sc-headline:last-child{border-bottom:none}
.sc-headline::before{content:'→ ';color:var(--blue);font-weight:800}
.sc-bday{font:400 11.5px/1.5 system-ui;color:rgba(255,255,255,.85);padding:2px 0}
.sc-bday strong{color:#fff;font-weight:700}
.sc-bday::before{content:'🎂 '}
.sc-history{font:400 12px/1.6 system-ui;color:rgba(255,255,255,.85);font-style:italic}
.sc-empty{font:italic 10px/1 system-ui;color:rgba(255,255,255,.25)}
.sc-footer{background:rgba(0,0,0,.25);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.sc-footer-handle{font:700 11px/1 system-ui;letter-spacing:.05em;color:rgba(255,255,255,.5)}
.sc-footer-league{font:600 9px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.sc-img{width:100%;height:190px;object-fit:cover;display:block}
.sc-img-placeholder{width:100%;height:190px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.sc-img-placeholder span{font:600 10px system-ui;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.sc-photo-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.2);flex-shrink:0}
.sc-photo-label{font:600 9px system-ui;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.sc-photo-btn{background:rgba(255,255,255,.12);border:none;border-radius:3px;color:rgba(255,255,255,.65);font:600 9px system-ui;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;cursor:pointer}
.sc-photo-btn:hover{background:rgba(255,255,255,.2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:10px 18px;border-radius:6px;font:500 12px system-ui;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:1000px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh;overflow:auto}
  .form-panel{height:auto;overflow:visible}
  .pane{overflow:visible;height:auto}
  .preview-panel{min-height:60vh;overflow:visible}
  .preview-wrap{overflow:visible;padding:12px}
  .doc{width:100%;max-width:700px}
  .preview-bar{position:sticky;top:0;z-index:10}
}
@media(max-width:600px){
  .doc-body{grid-template-columns:1fr}
  .doc-col{border-right:none;border-bottom:1px solid #eee;padding:10px 14px}
  .doc-col:last-child{border-bottom:none}
  .doc-hd{padding:10px 14px}
  .doc-matchup{padding:9px 14px}
  .doc-info{padding:5px 14px}
}
@media print{
  @page{size:letter portrait;margin:0.3in}
  body{background:#fff}
  .app{display:block;height:auto}
  .form-panel,.preview-bar,.toast{display:none!important}
  .preview-panel{background:#fff;overflow:visible;height:auto;display:block}
  .preview-wrap{padding:0;display:block;overflow:visible}
  .doc{width:100%;box-shadow:none}
  .doc-hd{padding:8px 16px}
  .doc-logo-img{height:24px}
  .doc-title-main{font-size:11px}
  .doc-matchup{padding:7px 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-team-name{font-size:12px;color:#fff!important}
  .doc-team-rec{color:rgba(255,255,255,.8)!important}
  .badge{display:none}
  .rank-team{font-size:9.5px}
  .rank-num{font-size:8.5px}
  .doc-info{padding:4px 16px}
  .doc-col{padding:8px 12px}
  .doc-sec-hd{margin-bottom:4px;padding-bottom:3px;font-size:7px}
  .ldr-tbl td{padding:2px 3px;font-size:9.5px}
  .ldr-tbl th{font-size:7.5px}
  .news-item{padding:3px 0}
  .news-headline{font-size:9.5px}
  .news-body{font-size:9px}
  .bday-item{font-size:9.5px}
  .bullet-list li{font-size:9.5px}
  .sched-item{font-size:9.5px}
  .result-score{font-size:9.5px}
  .result-note{font-size:8.5px}
  .official-item{padding:3px 5px}
  .official-name{font-size:9.5px}
  .note-text{font-size:9.5px}
  .club-note{padding:4px 8px;font-size:9px}
  .doc-ft{padding:4px 16px}
  .sec-gap{margin-top:7px}
  .bday-cat{margin:4px 0 2px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <div class="form-panel">
    <div class="panel-hd">
      <h1>OHL News &amp; Notes Builder</h1>
      <p>OHL Communications</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('league')">League Section</button>
      <button class="tab" onclick="switchTab('club')">Club Section</button>
    </div>
    <div id="pane-league" class="pane active">
      <div class="sec-lbl">Filled by OHL Communications — by 9 a.m. game day</div>
      <div id="locked-notice" class="locked-notice">🔒 Loaded from OHL Communications link</div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date" oninput="render()">
      </div>
      <div class="field">
        <label>OHL Power Rankings</label>
        <textarea id="f-rankings" rows="8" placeholder="Enter teams ranked 1–16, one per line:&#10;1. London Knights&#10;2. Windsor Spitfires&#10;..." oninput="render()" style="font-size:12px;line-height:1.6"></textarea>
      </div>
      <div class="field">
        <label>Yesterday's Results</label>
        <div id="rows-yest"></div>
        <button class="add-btn" onclick="addRow('yest')">+ Add Result</button>
      </div>
      <div class="field">
        <label>Today's Schedule</label>
        <textarea id="f-sched" rows="4" placeholder="e.g. Kingston at Peterborough, 7:05 p.m.&#10;Barrie at Sudbury, 7:30 p.m." oninput="render()"></textarea>
      </div>
      <div class="field">
        <label>League News</label>
        <div id="rows-news"></div>
        <button class="add-btn" onclick="addRow('news')">+ Add News Item</button>
      </div>
      <div class="field">
        <label>Alumni News</label>
        <div id="rows-alumni"></div>
        <button class="add-btn" onclick="addRow('alumni')">+ Add Alumni Item</button>
      </div>
      <div class="field">
        <label>This Day in OHL History</label>
        <textarea id="f-history" rows="2" placeholder="e.g. On this date in 1994, the Guelph Storm defeated the North Bay Centennials 5-2 in the OHL season opener." oninput="render()"></textarea>
      </div>
      <div class="field">
        <label>Birthdays — Current OHL Players</label>
        <div class="grid-hd" style="grid-template-columns:2fr 1.1fr 0.7fr 20px;"><span>Player</span><span>Team</span><span>Turns</span><span></span></div>
        <div id="rows-bdayP"></div>
        <button class="add-btn" onclick="addRow('bdayP')">+ Add Player Birthday</button>
      </div>
      <div class="field">
        <label>Birthdays — OHL Alumni</label>
        <div class="grid-hd" style="grid-template-columns:2fr 1fr 1.3fr 20px;"><span>Name</span><span>OHL Club</span><span>Current</span><span></span></div>
        <div id="rows-bdayA"></div>
        <button class="add-btn" onclick="addRow('bdayA')">+ Add Alumni Birthday</button>
      </div>
      <div class="actions">
        <button class="btn btn-dark" onclick="copyLink()">📋 Copy Club Link</button>
        <button class="btn btn-ghost" onclick="clearLeague()">Clear</button>
      </div>
    </div>
    <div id="pane-club" class="pane">
      <div class="sec-lbl">Filled by Club PR — in media rooms by 5 p.m.</div>
      <div class="field"><label>Away Team</label><input type="text" id="f-away" placeholder="e.g. Kingston Frontenacs" oninput="render()"></div>
      <div class="field"><label>Away Team Record</label><input type="text" id="f-away-rec" placeholder="e.g. 8-2-1" oninput="render()"></div>
      <div class="field"><label>Home Team</label><input type="text" id="f-home" placeholder="e.g. Peterborough Petes" oninput="render()"></div>
      <div class="field"><label>Home Team Record</label><input type="text" id="f-home-rec" placeholder="e.g. 6-4-0" oninput="render()"></div>

<script>
const $=id=>document.getElementById(id);
const v=id=>{const el=$(id);return el?el.value.trim():''};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function bullets(text){
  if(!text)return '<span class="empty-state">Not yet entered</span>';
  const lines=text.split('\n').map(l=>l.replace(/^[\s•\-\*]+/,'').trim()).filter(Boolean);
  return lines.length?'<ul class="bullet-list">'+lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':'<span class="empty-state">Not yet entered</span>';
}
function schedLines(text){
  if(!text)return '<span class="empty-state">Not yet entered</span>';
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  return lines.length?lines.map(l=>'<div class="sched-item">'+esc(l)+'</div>').join(''):'<span class="empty-state">Not yet entered</span>';
}
function getRows(key){return[...document.querySelectorAll('#rows-'+key+' [data-row]')]}
function rowInputs(row){return[...row.querySelectorAll('input,textarea')]}

// Row definitions
const ROWS={

  news:{init:3,make(){
    const d=document.createElement('div');
    d.className='news-entry';d.setAttribute('data-row','');
    d.innerHTML='<div class="news-entry-hd"><input placeholder="Headline" oninput="render()"><button class="rm-btn" onclick="rmRow(this,\'news\')" title="Remove">&times;</button></div><textarea rows="2" placeholder="One or two sentences." oninput="render()"></textarea>';
    return d;
  }},
  alumni:{init:3,make(){
    const d=document.createElement('div');
    d.className='news-entry';d.setAttribute('data-row','');
    d.innerHTML='<div class="news-entry-hd"><input placeholder="Headline" oninput="render()"><button class="rm-btn" onclick="rmRow(this,\'alumni\')" title="Remove">&times;</button></div><textarea rows="2" placeholder="One or two sentences." oninput="render()"></textarea>';
    return d;
  }},
  bdayP:{init:3,make(){
    const d=document.createElement('div');
    d.className='bday-row';d.setAttribute('data-row','');
    d.style.gridTemplateColumns='2fr 1.1fr 0.7fr 20px';
    d.innerHTML='<input placeholder="Name" oninput="render()"><input placeholder="Team" oninput="render()"><input placeholder="19" oninput="render()"><button class="rm-btn" onclick="rmRow(this,\'bdayP\')" title="Remove">&times;</button>';
    return d;
  }},
  bdayA:{init:3,make(){
    const d=document.createElement('div');
    d.className='bday-row';d.setAttribute('data-row','');
    d.style.gridTemplateColumns='2fr 1fr 1.3fr 20px';
    d.innerHTML='<input placeholder="Name" oninput="render()"><input placeholder="Club" oninput="render()"><input placeholder="NHL / Role" oninput="render()"><button class="rm-btn" onclick="rmRow(this,\'bdayA\')" title="Remove">&times;</button>';
    return d;
  }},
  yest:{init:2,make(){
    const d=document.createElement('div');
    d.className='news-entry';d.setAttribute('data-row','');
    d.innerHTML='<div class="news-entry-hd"><input placeholder="e.g. Kingston 4, Peterborough 2" oninput="render()"><button class="rm-btn" onclick="rmRow(this,\'yest\')" title="Remove">&times;</button></div><input placeholder="Top performers (optional — e.g. Smith 2G1A, Jones 31 saves)" oninput="render()" style="width:100%;background:#fff;border:1px solid rgba(0,59,111,.15);border-radius:3px;color:#777;font:11px system-ui;padding:5px 7px;outline:none;margin-top:4px">';
    return d;
  }}
};

function addRow(key,focus=true){
  const container=$('rows-'+key);
  const row=ROWS[key].make();
  // Tab on last input of last row → add new row
  const inputs=row.querySelectorAll('input,textarea');
  const last=inputs[inputs.length-1];
  if(last){
    last.addEventListener('keydown',e=>{
      if(e.key!=='Tab'||e.shiftKey)return;
      const allRows=container.querySelectorAll('[data-row]');
      if(row!==allRows[allRows.length-1])return;
      e.preventDefault();
      addRow(key,true);
    });
  }
  container.appendChild(row);
  if(focus&&inputs[0])inputs[0].focus();
  render();
}

function rmRow(btn,key){
  const container=$('rows-'+key);
  if(container.querySelectorAll('[data-row]').length<=1)return;
  btn.closest('[data-row]').remove();
  render();
}

function initAllRows(){
  Object.keys(ROWS).forEach(key=>{for(let i=0;i<ROWS[key].init;i++)addRow(key,false);});
}

function render(){
  const date=v('f-date');
  const fmtDate=date?new Date(date+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'Date TBD';
  const home=esc(v('f-home')||'Home Team'),away=esc(v('f-away')||'Away Team');
  const awayRec=esc(v('f-away-rec')),homeRec=esc(v('f-home-rec'));
  const time=esc(v('f-time')),arena=esc(v('f-arena')),bcast=esc(v('f-bcast')),cnote=esc(v('f-cnote'));
  const logoHtml=LOGO_SRC?'<img class="doc-logo-img" src="'+LOGO_SRC+'" alt="OHL">':'<div class="doc-logo-text">OHL</div>';

  const parseRank=l=>{const c=l.replace(/^\s*\d+[.):\s]+/,'').trim();const m=c.match(/^(.*?)\s*([\+\-]\d+)\s*$/);return m?{team:m[1].trim(),move:parseInt(m[2])}:{team:c,move:null};};
  const rankParsed=v('f-rankings').split('\n').map(s=>s.trim()).filter(Boolean).map(parseRank);
  const mvHtml=r=>r.move>0?'<span class="rank-up">↑+'+r.move+'</span>':r.move<0?'<span class="rank-dn">↓'+r.move+'</span>':'';
  const rankBlock=rankParsed.length?(()=>{
    const left=rankParsed.slice(0,8),right=rankParsed.slice(8,16);
    const rows=Math.max(left.length,right.length);
    let html='<table class="rank-tbl"><tbody>';
    for(let i=0;i<rows;i++){
      const lNum=i+1,rNum=i+9,l=left[i],r=right[i];
      html+='<tr>';
      html+='<td class="rank-num">'+(l?lNum:'')+'</td><td class="rank-team">'+(l?esc(l.team):'')+(l?mvHtml(l):'')+'</td>';
      html+='<td class="rank-div"></td>';
      html+='<td class="rank-num">'+(r?rNum:'')+'</td><td class="rank-team">'+(r?esc(r.team):'')+(r?mvHtml(r):'')+'</td>';
      html+='</tr>';
    }
    html+='</tbody></table>';return html;
  })():'<span class="empty-state">Not yet entered</span>';

  let newsHtml='',hasNews=false;
  getRows('news').forEach(row=>{
    const el=rowInputs(row);
    const h=el[0]?.value.trim(),b=el[1]?.value.trim();
    if(h){hasNews=true;newsHtml+='<div class="news-item"><div class="news-headline">'+esc(h)+'</div>'+(b?'<div class="news-body">'+esc(b)+'</div>':'')+'</div>';}
  });
  if(!hasNews)newsHtml='<span class="empty-state">Not yet entered</span>';

  let alumniHtml='',hasAlumni=false;
  getRows('alumni').forEach(row=>{
    const el=rowInputs(row);
    const h=el[0]?.value.trim(),b=el[1]?.value.trim();
    if(h){hasAlumni=true;alumniHtml+='<div class="news-item"><div class="news-headline">'+esc(h)+'</div>'+(b?'<div class="news-body">'+esc(b)+'</div>':'')+'</div>';}
  });
  if(!hasAlumni)alumniHtml='<span class="empty-state">Not yet entered</span>';

  let bdayP='',hasBP=false;
  getRows('bdayP').forEach(row=>{
    const inp=rowInputs(row).filter(e=>e.tagName==='INPUT');
    const n=inp[0]?.value.trim(),t=inp[1]?.value.trim(),a=inp[2]?.value.trim();
    if(n){hasBP=true;bdayP+='<div class="bday-item"><strong>'+esc(n)+'</strong>'+(t?' <span style="color:#888">('+esc(t)+')</span>':'')+(a?' &mdash; turns '+esc(a):'')+'</div>';}
  });
  let bdayA='',hasBA=false;
  getRows('bdayA').forEach(row=>{
    const inp=rowInputs(row).filter(e=>e.tagName==='INPUT');
    const n=inp[0]?.value.trim(),c=inp[1]?.value.trim(),r=inp[2]?.value.trim();
    if(n){hasBA=true;bdayA+='<div class="bday-item"><strong>'+esc(n)+'</strong>'+(c?' <span style="color:#888">(OHL: '+esc(c)+')</span>':'')+(r?' &mdash; '+esc(r):'')+'</div>';}
  });
  let bdayBlock='';
  if(hasBP)bdayBlock+='<div class="bday-cat">Current Players</div>'+bdayP;
  if(hasBA)bdayBlock+='<div class="bday-cat">Alumni</div>'+bdayA;
  if(!hasBP&&!hasBA)bdayBlock='<span class="empty-state">No birthdays today</span>';

  let infoItems='';
  if(time)infoItems+='<div class="doc-info-item"><strong>'+time+'</strong></div>';
  if(arena)infoItems+='<div class="doc-info-item">'+arena+'</div>';
  if(bcast)infoItems+='<div class="doc-info-item">'+bcast+'</div>';

  const ref1=v('f-ref1'),ref2=v('f-ref2'),lin1=v('f-lin1'),lin2=v('f-lin2');
  const hasOff=ref1||ref2||lin1||lin2;
  const offBlock=hasOff?'<div class="officials-doc"><div class="official-item"><div class="official-role">Referee</div><div class="official-name">'+esc(ref1||'TBA')+'</div></div><div class="official-item"><div class="official-role">Referee</div><div class="official-name">'+esc(ref2||'TBA')+'</div></div><div class="official-item"><div class="official-role">Linesperson</div><div class="official-name">'+esc(lin1||'TBA')+'</div></div><div class="official-item"><div class="official-role">Linesperson</div><div class="official-name">'+esc(lin2||'TBA')+'</div></div></div>':'<span class="empty-state">Not yet entered</span>';

  const story=v('f-story'),lineup=v('f-lineup'),media=v('f-media');
  let club='';
  if(story)club+='<div class="doc-sec-hd">Storylines <span class="badge dark">Club</span></div>'+bullets(story);
  if(lineup)club+='<div class="doc-sec-hd sec-gap">Lineup Notes <span class="badge dark">Club</span></div>'+bullets(lineup);
  club+='<div class="doc-sec-hd sec-gap">Tonight\'s Officials <span class="badge dark">Club</span></div>'+offBlock;
  if(media)club+='<div class="doc-sec-hd sec-gap">Media Information <span class="badge dark">Club</span></div><div class="note-text">'+esc(media)+'</div>';
  if(cnote)club+='<div class="club-note">'+cnote+'</div>';
  if(!story&&!lineup&&!hasOff&&!media&&!cnote)club='<span class="empty-state">Club section not yet completed</span>';

  $('doc').innerHTML=
    '<div class="doc-hd"><div class="doc-logo-area">'+logoHtml+'</div><div class="doc-title"><div class="doc-title-main">News &amp; Notes</div><div class="doc-title-sub">Ontario Hockey League</div></div><div class="doc-hd-right"><div class="doc-date">'+fmtDate+'</div></div></div>'
    +'<div class="doc-matchup"><div class="doc-team"><div class="doc-team-lbl">Visiting</div><div class="doc-team-name">'+away+'</div>'+(awayRec?'<div class="doc-team-rec">('+awayRec+')</div>':'')+'</div><div class="doc-vs">AT</div><div class="doc-team"><div class="doc-team-lbl">Home</div><div class="doc-team-name">'+home+'</div>'+(homeRec?'<div class="doc-team-rec">('+homeRec+')</div>':'')+'</div></div>'
    +(infoItems?'<div class="doc-info">'+infoItems+'</div>':'')
    +'<div class="doc-body"><div class="doc-col">'
    +'<div class="doc-sec-hd">OHL Power Rankings <span class="badge">OHL</span></div>'+rankBlock
    +(()=>{const rr=getRows('yest').map(r=>{const ins=rowInputs(r);return{score:ins[0]?.value||'',note:ins[1]?.value||''};}).filter(r=>r.score);return rr.length?"<div class='doc-sec-hd sec-gap'>Yesterday's Results <span class='badge'>OHL</span></div>"+rr.map(r=>'<div class="result-entry"><div class="result-score">'+esc(r.score)+'</div>'+(r.note?'<div class="result-note">'+esc(r.note)+'</div>':'')+'</div>').join(''):'';;})()
    +"<div class='doc-sec-hd sec-gap'>Today's Schedule <span class='badge'>OHL</span></div>"+schedLines(v('f-sched'))
    +'<div class="doc-sec-hd sec-gap">League News <span class="badge">OHL</span></div>'+newsHtml
    +(hasAlumni?'<div class="doc-sec-hd sec-gap">Alumni News <span class="badge">OHL</span></div>'+alumniHtml:'')
    +(v('f-history')?'<div class="doc-sec-hd sec-gap">On This Day in OHL History <span class="badge">OHL</span></div><div class="note-text">'+esc(v('f-history'))+'</div>':'')
    +((hasBP||hasBA)?'<div class="doc-sec-hd sec-gap">OHL Birthdays <span class="badge">OHL</span></div>'+bdayBlock:'')
    +'</div><div class="doc-col"><div class="doc-sec-hd">Tonight\'s Game <span class="badge dark">Club</span></div>'+club+'</div></div>'
    +'<div class="doc-ft"><span>OHL News &amp; Notes &middot; Prepared by OHL Communications</span><span>ontariohockeyleague.com</span></div>';
  if(currentView==='social')renderSocial();
  saveDrafts();
}

function switchTab(tab){
  document.querySelectorAll('.tab')[0].classList.toggle('active',tab==='league');
  document.querySelectorAll('.tab')[1].classList.toggle('active',tab==='club');
  $('pane-league').classList.toggle('active',tab==='league');
  $('pane-club').classList.toggle('active',tab==='club');
}

function getLeagueData(){
  return{
    date:v('f-date'),
    rankings:v('f-rankings'),
    yest:getRows('yest').map(row=>{const ins=rowInputs(row);return{score:ins[0]?.value.trim()||'',note:ins[1]?.value.trim()||''}}),sched:v('f-sched'),
    news:getRows('news').map(row=>{const el=rowInputs(row);return{h:el[0]?.value.trim()||'',b:el[1]?.value.trim()||''}}),
    alumni:getRows('alumni').map(row=>{const el=rowInputs(row);return{h:el[0]?.value.trim()||'',b:el[1]?.value.trim()||''}}),
    bdayP:getRows('bdayP').map(row=>{const inp=rowInputs(row).filter(e=>e.tagName==='INPUT');return{n:inp[0]?.value.trim()||'',t:inp[1]?.value.trim()||'',a:inp[2]?.value.trim()||''}}),
    bdayA:getRows('bdayA').map(row=>{const inp=rowInputs(row).filter(e=>e.tagName==='INPUT');return{n:inp[0]?.value.trim()||'',c:inp[1]?.value.trim()||'',r:inp[2]?.value.trim()||''}}),
    history:v('f-history')
  };
}

function copyLink(){
  const enc=btoa(unescape(encodeURIComponent(JSON.stringify(getLeagueData()))));
  const url=location.href.split('#')[0]+'#'+enc;
  navigator.clipboard.writeText(url).then(()=>toast('Club link copied!')).catch(()=>{const inp=document.createElement('input');inp.value=url;document.body.appendChild(inp);inp.select();document.execCommand('copy');document.body.removeChild(inp);toast('Club link copied!');});
}

function populateRows(key,items){
  const container=$('rows-'+key);
  container.querySelectorAll('[data-row]').forEach(r=>r.remove());
  items.forEach((item,idx)=>{
    addRow(key,false);
    const row=container.querySelectorAll('[data-row]')[idx];
    if(!row)return;
    const inputs=rowInputs(row);
    Object.values(item).forEach((val,i)=>{if(inputs[i]&&val)inputs[i].value=val;});
  });
}

function loadHash(){
  const hash=location.hash.slice(1);if(!hash)return;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(hash))));
    if(d.date)$('f-date').value=d.date;
    if(d.rankings)$('f-rankings').value=d.rankings;
    if(d.yest?.length)populateRows('yest',d.yest);
    if(d.sched)$('f-sched').value=d.sched;
    if(d.news?.length)populateRows('news',d.news);
    if(d.alumni?.length)populateRows('alumni',d.alumni);
    if(d.bdayP?.length)populateRows('bdayP',d.bdayP);
    if(d.bdayA?.length)populateRows('bdayA',d.bdayA);
    if(d.history)$('f-history').value=d.history;
    $('locked-notice').style.display='block';
    switchTab('club');render();
    toast('League section loaded — fill in your club info below');
  }catch(e){}
}

function clearLeague(){
  $('f-date').value='';$('f-rankings').value='';$('f-sched').value='';$('f-history').value='';
  ['yest','news','alumni','bdayP','bdayA'].forEach(key=>{
    const c=$('rows-'+key);c.querySelectorAll('[data-row]').forEach(r=>r.remove());
    for(let i=0;i<ROWS[key].init;i++)addRow(key,false);
  });
  try{localStorage.removeItem('ohl-nn-league');}catch(e){}
  render();
}

function clearClub(){
  ['f-away','f-away-rec','f-home','f-home-rec','f-time','f-arena','f-bcast','f-story','f-lineup','f-ref1','f-ref2','f-lin1','f-lin2','f-media','f-cnote'].forEach(id=>$(id).value='');
  try{localStorage.removeItem('ohl-nn-club-'+(v('f-date')||'nodate'));}catch(e){}
  render();
}

// Draft persistence
function clubDraftKey(){return'ohl-nn-club-'+(v('f-date')||'nodate');}
function saveDrafts(){
  try{
    localStorage.setItem('ohl-nn-league',JSON.stringify(getLeagueData()));
    localStorage.setItem(clubDraftKey(),JSON.stringify({
      away:v('f-away'),awayRec:v('f-away-rec'),home:v('f-home'),homeRec:v('f-home-rec'),
      time:v('f-time'),arena:v('f-arena'),bcast:v('f-bcast'),story:v('f-story'),
      lineup:v('f-lineup'),ref1:v('f-ref1'),ref2:v('f-ref2'),lin1:v('f-lin1'),
      lin2:v('f-lin2'),media:v('f-media'),cnote:v('f-cnote')
    }));
  }catch(e){}
}
function loadLeagueDraft(){
  try{
    const raw=localStorage.getItem('ohl-nn-league');if(!raw)return;
    const d=JSON.parse(raw);
    if(d.date)$('f-date').value=d.date;
    if(d.rankings)$('f-rankings').value=d.rankings;
    if(d.yest?.length)populateRows('yest',d.yest);
    if(d.sched)$('f-sched').value=d.sched;
    if(d.news?.length)populateRows('news',d.news);
    if(d.alumni?.length)populateRows('alumni',d.alumni);
    if(d.bdayP?.length)populateRows('bdayP',d.bdayP);
    if(d.bdayA?.length)populateRows('bdayA',d.bdayA);
    if(d.history)$('f-history').value=d.history;
  }catch(e){}
}
function loadClubDraft(){
  try{
    const raw=localStorage.getItem(clubDraftKey());if(!raw)return;
    const d=JSON.parse(raw);
    const set=(id,val)=>{if(val&&$(id))$(id).value=val;};
    set('f-away',d.away);set('f-away-rec',d.awayRec);set('f-home',d.home);set('f-home-rec',d.homeRec);
    set('f-time',d.time);set('f-arena',d.arena);set('f-bcast',d.bcast);set('f-story',d.story);
    set('f-lineup',d.lineup);set('f-ref1',d.ref1);set('f-ref2',d.ref2);
    set('f-lin1',d.lin1);set('f-lin2',d.lin2);set('f-media',d.media);set('f-cnote',d.cnote);
  }catch(e){}
}

function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}

let currentView='sheet';
let socialImgSrc=null;
function loadSocialPhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    socialImgSrc=e.target.result;
    $('sc-photo-name').textContent=file.name;
    $('sc-remove-btn').style.display='';
    renderSocial();
  };
  reader.readAsDataURL(file);
}
function removeSocialPhoto(){
  socialImgSrc=null;
  $('sc-photo-name').textContent='No photo selected';
  $('sc-remove-btn').style.display='none';
  $('sc-file-input').value='';
  renderSocial();
}
function downloadCard(){
  const card=$('social-card');
  if(!card||!window.html2canvas){alert('Download not available — please wait for the page to fully load.');return;}
  const btn=event.target;
  btn.textContent='Saving…';btn.disabled=true;
  html2canvas(card,{scale:3,useCORS:true,backgroundColor:null,logging:false}).then(canvas=>{
    const link=document.createElement('a');
    const d=v('f-date')||new Date().toISOString().slice(0,10);
    link.download='ohl-daily-brief-'+d+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    btn.textContent='⬇ Download Card';btn.disabled=false;
  }).catch(()=>{btn.textContent='⬇ Download Card';btn.disabled=false;alert('Export failed — try again.');});
}
function switchView(v){
  currentView=v;
  $('preview-wrap').classList.toggle('hidden',v!=='sheet');
  $('social-wrap').classList.toggle('active',v==='social');
  $('btn-sheet').classList.toggle('active',v==='sheet');
  $('btn-social').classList.toggle('active',v==='social');
  $('print-btn').style.display=v==='sheet'?'':'none';
  if(v==='social')renderSocial();
}

function renderSocial(){
  const logoImg=WHITE_LOGO_SRC?'<img class="sc-logo" src="'+WHITE_LOGO_SRC+'" alt="OHL">':LOGO_SRC?'<img class="sc-logo" src="'+LOGO_SRC+'" alt="OHL">':'<span style="font:900 18px system-ui;color:#fff">OHL</span>';
  const dateStr=v('f-date')?new Date(v('f-date')+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'';
  // Headlines — first 3 news rows with content
  const headlines=getRows('news').map(r=>rowInputs(r)[0]?.value.trim()).filter(Boolean);
  const headlineHtml=headlines.length
    ?headlines.map(h=>'<div class="sc-headline">'+esc(h)+'</div>').join('')
    :'<div class="sc-empty">No headlines entered</div>';
  // Alumni headlines — first 3
  const alumniLines=getRows('alumni').map(r=>rowInputs(r)[0]?.value.trim()).filter(Boolean).slice(0,3);
  const alumniHeadHtml=alumniLines.length
    ?alumniLines.map(h=>'<div class="sc-headline">'+esc(h)+'</div>').join('')
    :null;
  // Birthdays — current players
  const bdays=getRows('bdayP').map(r=>{const ins=rowInputs(r);return{n:ins[0]?.value.trim(),t:ins[1]?.value.trim(),a:ins[2]?.value.trim()};}).filter(r=>r.n);
  const bdayHtml=bdays.length
    ?bdays.map(b=>'<div class="sc-bday"><strong>'+esc(b.n)+'</strong>'+(b.t?' · '+esc(b.t):'')+(b.a?' · Turns '+esc(b.a):'')+'</div>').join('')
    :'<div class="sc-empty">No birthdays entered</div>';
  // History
  const hist=v('f-history').trim();
  const histHtml=hist?'<div class="sc-history">'+esc(hist)+'</div>':'<div class="sc-empty">Not yet entered</div>';

  const imgBlock=socialImgSrc
    ?'<img class="sc-img" src="'+socialImgSrc+'" alt="">'
    :'';
  $('social-card').innerHTML=
    '<div class="sc-header">'+logoImg+'<div class="sc-title-block"><div class="sc-title">Daily Brief</div><div class="sc-date">'+esc(dateStr)+'</div></div></div>'
   +imgBlock
   +'<div class="sc-body">'
   +'<div class="sc-section"><div class="sc-sec-lbl">League News</div>'+headlineHtml+'</div>'
   +(alumniHeadHtml?'<div class="sc-section"><div class="sc-sec-lbl">Alumni News</div>'+alumniHeadHtml+'</div>':'')
   +(bdays.length?'<div class="sc-section"><div class="sc-sec-lbl">Happy Birthday</div>'+bdayHtml+'</div>':'')
   +(hist?'<div class="sc-section"><div class="sc-sec-lbl">This Day in OHL History</div>'+histHtml+'</div>':'')
   +'</div>'
   +'<div class="sc-footer"><span class="sc-footer-handle">@OHLprguy</span><span class="sc-footer-league">Ontario Hockey League</span></div>';
}

window.addEventListener('DOMContentLoaded',()=>{
  $('f-date').value=new Date().toISOString().split('T')[0];
  initAllRows();
  if(location.hash){
    loadHash();
    loadClubDraft();
  }else{
    loadLeagueDraft();
    loadClubDraft();
  }
  render();
});
</script>
